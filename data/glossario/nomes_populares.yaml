  note: >-
    Seoi feito caindo de joelhos. Pode ser Seoi-nage ou Ippon-seoi-nage de joelhos, e é
    muitas vezes confundido com Seoi-otoshi.

- name: Drop Seoi Nage
  technique_ids: [seoi-nage, ippon-seoi-nage, seoi-otoshi]
