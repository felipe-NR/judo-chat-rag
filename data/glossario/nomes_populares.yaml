# Nomes pelos quais as técnicas são conhecidas no Brasil e que não são grafia do
# nome oficial. Cada nome aparece uma vez; mais de um technique_id = ambíguo.
# Fontes: respostas das sessões judobase-db e judo-techniques-bot (2026-10-04),
# conhecimento dos modelos, NÃO VERIFICADO salvo indicação em `source`.
# kind: popular (nome japonês impreciso), truncation (nome cortado),
#       nonstandard (nome fora do Kodokan), pt_br (termo em português), bjj.

# ---------- truncamentos e nomes japoneses imprecisos ----------
- name: Ashi-barai
  technique_ids: [deashi-harai, okuriashi-harai]
  kind: popular
  confidence: media
  source: sessões judobase-db e judo-techniques-bot
  note: >-
    Deashi-harai varre o pé que avança; Okuriashi-harai varre os dois pés juntos num
    deslocamento lateral. Às vezes é usado para qualquer varrida de pé.

