# Gerado por scripts/import_fgj.py a partir do material da FGJ. Não edite à mão.
- id: seoi-nage
  tecnica: Seoi-nage
  kanji: 背負投
  traducao: PROJEÇÃO COM CARREGAMENTO NAS COSTAS
  descricao_kodokan: Uma técnica para lançar o oponente sobre o ombro direito, desequilibrando-o para
    a frente e inserindo o cotovelo direito sob a axila direita para carregá-lo nas costas.
  principio: NAGE = Movimento em que há uma suspensão do uke para em seguida ser projetado
  kyo_grupo:
    original: 1º - TE-WAZA
    gokyo: 1
- id: tai-otoshi
  tecnica: Tai-otoshi
  kanji: 体落
  traducao: DERRUBADA BRUSCA DO CORPO
  descricao_kodokan: Uma técnica para puxar para baixo e arremessar o oponente, quebrando seu equilíbrio
    para frente e girando o corpo para a esquerda para colocar o pé direito na frente do pé direito dele.
  principio: OTOSHI = Movimento de uma derrubada brusca, diretamente para baixo, sem suspensão.
  kyo_grupo:
    original: 2º - TE-WAZA
    gokyo: 2
- id: uki-otoshi
  tecnica: Uki-otoshi
  kanji: 浮落
  traducao: DERRUBADA BRUSCA COM FLUTUAÇÃO
  descricao_kodokan: Uma técnica para derrubar o oponente quebrando seu equilíbrio para frente e puxando-o
    para baixo em direção ao canto frontal direito.
  principio: UKI = Característica na técnica em que o movimento causa uma flutuação, ou seja, uma breve
    uma suspensão que resulta no desequilíbrio. OTOSHI = Movimento de uma derrubada brusca, diretamente
    para baixo, sem suspensão.
  kyo_grupo:
    original: 4º - TE-WAZA
    gokyo: 4
- id: sumi-otoshi
  tecnica: Sumi-otoshi
  kanji: 隅落
  traducao: DERRUBADA BRUSCA PARA O CANTO
  descricao_kodokan: Uma técnica para empurrar e derrubar o oponente, desequilibrando-o em direção ao
    canto traseiro direito enquanto pisa na parte externa do pé´ direito com o esquerdo.
  principio: OTOSHI = Movimento de uma derrubada brusca, diretamente para baixo, sem suspensão
  kyo_grupo:
    original: 5º - TE-WAZA
    gokyo: 5
- id: kata-guruma
  tecnica: Kata-guruma
  kanji: 肩車
  traducao: ROTAÇÃO PELO OMBRO
  descricao_kodokan: Tecnica para levantar o oponente sobre os dois ombros, na parte de trás do pescoço,
    e derrubá-lo, quebrando seu equilíbrio para frente enquanto segura sua coxa direita por dentro com
    o braço direito.
  principio: GURUMA = Movimento que causa uma rotação, um giro.
  kyo_grupo:
    original: 3º - TE-WAZA
    gokyo: 3
- id: sukui-nage
  tecnica: Sukui-nage
  kanji: 掬投
  traducao: PROJEÇÃO COM COLHIMENTO E LEVANTAMENTO
  descricao_kodokan: Uma técnica para levantar e derrubar o oponente, quebrando seu equilíbrio para trás
    enquanto pisa atrás dele e segura ambas as coxas pela parte da frente com ambas as mãos ou outra técnica
    para
  principio: SUKUI = Movimento de colhida com levantamento,
  kyo_grupo:
    original: 4º - TE-WAZA
    gokyo: 4
- id: deashi-harai
