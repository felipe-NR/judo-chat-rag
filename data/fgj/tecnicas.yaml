  kyo_grupo:
    original: 5º - YOKO-SUTEMI-WAZA
    gokyo: 5
- id: yoko-wakare
  tecnica: Yoko-Wakare
  kanji: 横分
  traducao: SEPARAÇÃO LATERAL
  descricao_kodokan: Uma técnica para derrubar o oponente quebrando seu equilíbrio para frente e pisando
    com os dois pés na parte externa do pé´ direito enquanto deita o corpo sobre o lado esquerdo e o gira
    sobre o corpo.
  principio: Wakare = Movimento que é caracterizado por uma separação com o tori de um lado e o uke de
    outro.
  kyo_grupo:
    original: 5º - YOKO-SUTEMI-WAZA
    gokyo: 5
- id: ippon-seoi-nage
  tecnica: Ippon-seoi-nage
  kanji: 一本背負投
  traducao: PROJEÇÃO COM CARREGAMENTO NAS COSTAS POR UM BRAÇO
  descricao_kodokan: Uma técnica para lançar o oponente sobre o ombro direito, quebrando seu equilíbrio
    para frente e segurando seu braço direito por dentro com o braço direito para carregá-lo nas costas.
  principio: NAGE = Movimento em que há uma suspensão do uke para em seguida ser projetado Ippon = 1 (um)
  kyo_grupo:
    original: TE-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: seoi-otoshi
  tecnica: Seoi-otoshi
  kanji: 背負落
  traducao: DERRUBADA COM CARREGAMENTO NAS COSTAS
  descricao_kodokan: Uma técnica para puxar para baixo e arremessar o oponente, desequilibrando-o para
    frente e caindo sobre um dos joelhos ou ambos enquanto o carrega nas costas.
  principio: OTOSHI = Movimento de uma derrubada brusca, diretamente para baixo, sem suspensão. Derrubada
    pode ser realizada com um ou os dois joelhos
  kyo_grupo:
    original: TE-WAZA HABUKARETA-WAZA
    classe: habukareta-waza
- id: uchi-mata-sukashi
  tecnica: Uchi-mata-sukashi
  kanji: 内股すかし
  traducao: ABERTURA (DE ESPAÇO) PARA UCHI-MATA
  descricao_kodokan: Uma técnica para repelir a tentativa de Uchi-mata do oponente e derrubá-lo.
  principio: SUKASHI = abertura de espaço, esquiva. Projeção com membros superiores (TE-WAZA)
  kyo_grupo:
    original: TE-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: kouchi-gaeshi
  tecnica: Ko-uchi-gaeshi
  kanji: 小内返
  traducao: CONTRAGOLPE (DA CEIFA) INTERIOR MENOR
  descricao_kodokan: Uma técnica para desviar da tentativa de Ko-uchi-gari do oponente e derrubá-lo.
  principio: Contragolpe de uma tentativa de Ko-uchi-gari Projeção com membros superiores (TE-WAZA)
  kyo_grupo:
    original: TE-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: yama-arashi
  tecnica: Yama-arashi
  kanji: 山嵐
  traducao: TEMPESTADE DA MONTANHA
  descricao_kodokan: Uma técnica para varrer a perna direita do oponente com o pé direito e derrubá-lo,
    agarrando sua manga direita com a mão esquerda e segurando sua gola lateral direita com o polegar
    direito para dentro, enquanto quebra seu equilíbrio levantando-o para frente.
  principio: Pegada cruzada, quebrando o equilíbrio do uke para frente. Projeção com membros superiores
    (TE-WAZA), com varrida de perna como elemento complementar.
  kyo_grupo:
    original: TE-WAZA HABUKARETA-WAZA
    classe: habukareta-waza
- id: obi-tori-gaeshi
  tecnica: Obi-tori-gaeshi
  kanji: 帯取返
  traducao: INVERSÃO COM PEGADA NA FAIXA
  descricao_kodokan: Uma técnica para lançar o oponente sobre o ombro direito, agarrando seu cinto sobre
    o ombro com a mão direita e segurando seu braço ou perna direita com a mão esquerda enquanto o levanta.
  principio: Domínio cruzado chegando até a faixa, outra mão na calça e projeção com auxílio perna/quadril.
    Projeção com membros superiores (te-waza)
  kyo_grupo:
    original: TE-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: obi-otoshi
  tecnica: Obi-otoshi
  kanji: 帯落
  traducao: DERRUBADA PELA FAIXA
  descricao_kodokan: Uma técnica para levantar e derrubar o oponente agarrando a parte da frente do cinto
    dele com a mão direita, puxando-o para frente enquanto pisa atras dele e segura seu quadril pela parte
    da frente com a mão esquerda para desequilibrar o oponente para trás.
  principio: OTOSHI = Movimento de uma derrubada brusca, diretamente para baixo, sem suspensão. Uma mão
    controlando pela faixa e outra segurando quadril. Projeção diretamente para trás
  kyo_grupo:
    original: TE-WAZA HABUKARETA-WAZA
    classe: habukareta-waza
- id: morote-gari
  tecnica: Morote-gari
  kanji: 双手刈
  traducao: CEIFA COM AS DUAS MÃOS
  descricao_kodokan: Uma técnica para ceifar e derrubar o oponente segurando ambas as pernas dele pelo
    lado de fora com as duas mãos.
  principio: GARI = movimento de um corte de uma raiz Segurar as pernas pelo lado de fora com as duas
    mãos
  kyo_grupo:
    original: TE-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: kuchiki-taoshi
  tecnica: Kuchiki-taoshi
  kanji: 朽木倒
  traducao: TOMBAMENTO DA ÁRVORE APODRECIDA
  descricao_kodokan: Uma técnica para empurrar o oponente para trás, segurando uma de suas pernas por
    dentro ou por fora com uma das mãos e puxando-a para cima
  principio: TAOSHI = tombamento, fazer cair como um dominó Segurar a perna por dentro ou por fora
  kyo_grupo:
    original: TE-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: kibisu-gaeshi
  tecnica: Kibisu-gaeshi
  kanji: 踵返
  traducao: INVERSÃO PELO CALCANHAR
  descricao_kodokan: Uma técnica para arremessar o oponente, golpeando seu calcanhar por dentro ou por
    fora com uma das mãos.
  principio: Colha o calcanhar do uke, arrancando do solo e derrubando diretamente quando o uke transfere
    seu peso Segurar a perna por dentro ou por fora
  kyo_grupo:
    original: TE-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: tsubame-gaeshi
  tecnica: Tsubame-gaeshi
  kanji: 燕返
  traducao: CONTRAGOLPE DA ANDORINHA
  descricao_kodokan: Uma técnica para derrubar o oponente, defendendo-se de sua tentativa de varredura
    com o pé e contra varrendo com o mesmo pé que estava sendo atacado.
  principio: Contragolpe de uma tentativa de ashi-harai (de ou okuri)
  kyo_grupo:
    original: ASHI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: ouchi-gaeshi
  tecnica: O-uchi-gaeshi
  kanji: 大内返
  traducao: CONTRAGOLPE (DA CEIFA) INTERIOR MAIOR
  descricao_kodokan: Uma técnica para derrubar o oponente revidando sua tentativa de O-uchi-gari com a
    perna que está sendo atacada.
  principio: Contragolpe de uma tentativa de O-uchi-gari. Podendo varrer uma ou as duas pernas. Projeção
    com membros inferiores (ASHI-WAZA)
  kyo_grupo:
    original: ASHI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: osoto-otoshi
  tecnica: O-soto-otoshi
  kanji: 大外落
  traducao: DERRUBADA EXTERNA MAIOR
  descricao_kodokan: Uma técnica para derrubar o oponente verticalmente, desequilibrando-o para trás e
    deslizando a perna direita na parte de trás da coxa direita.
  principio: OTOSHI = Movimento de uma derrubada brusca, diretamente para baixo, sem suspensão. Movimento
    descendente da perna do tori, finalizando com o pé junto ao tatame.
  kyo_grupo:
    original: ASHI-WAZA HABUKARETA-WAZA
    classe: habukareta-waza
- id: osoto-gaeshi
  tecnica: O-soto-gaeshi
  kanji: 大外返
  traducao: CONTRAGOLPE (DA CEIFA) EXTERIOR MAIOR
  descricao_kodokan: Uma técnica para derrubar o oponente revidando sua tentativa de O-soto-gari com a
    perna que está sendo atacada
  principio: Contragolpe de uma tentativa de O-soto-gari. Pode reverter ainda com a perna do uke na mesma
    direção ou firmar o pé de apoio e rotacionar o tronco para projetar
  kyo_grupo:
    original: ASHI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: harai-goshi-gaeshi
  tecnica: Harai-goshi-gaeshi
  kanji: 払腰返
  traducao: CONTRAGOLPE (DA PROJEÇÃO PELO) QUADRIL COM VARREDURA
  descricao_kodokan: Uma técnica para derrubar o oponente neutralizando sua tentativa de Harai-goshi de
    arrancar ou enganchar seu pé de apoio de fora com o pé ou a perna.
  principio: Contragolpe de uma tentativa de Harai-goshi. Importante o tai-sabaki (manejo do corpo) impondo
    a resistência para então contrapor o ataque com a ceifa ou enganche
  kyo_grupo:
    original: ASHI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: uchi-mata-gaeshi
  tecnica: Uchi-mata-gaeshi
  kanji: 内股返
  traducao: CONTRAGOLPE (DA PROJEÇÃO PELO) INTERIOR DA COXA
  descricao_kodokan: Uma técnica para derrubar o oponente neutralizando sua tentativa de Uchi-mata, seja
    arrancando ou enganchando seu pé de apoio de fora com o pé ou a perna.
  principio: Contragolpe de uma tentativa de Uchi-mata. Importante o tai-sabaki (manejo do corpo) impondo
    a resistência para então contrapor o ataque com a ceifa ou enganche
  kyo_grupo:
    original: ASHI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: hane-goshi-gaeshi
  tecnica: Hane-goshi-gaeshi
  kanji: 跳腰返
  traducao: CONTRAGOLPE (DA PROJEÇÃO PELO) QUADRIL COM IMPULSÃO
  descricao_kodokan: Uma técnica para derrubar o oponente neutralizando sua tentativa de Hane-goshi de
    ceifar ou enganchar seu pé de apoio de fora com o pé ou a perna.
  principio: Contragolpe de uma tentativa de Hane-goshi. Importante o tai-sabaki (manejo do corpo) impondo
    a resistência para então contrapor o ataque com a ceifa ou enganche
  kyo_grupo:
    original: ASHI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: sode-tsurikomi-goshi
  tecnica: Sode-tsurikomi-goshi
  kanji: 袖釣込腰
  traducao: (PROJEÇÃO PELO) QUADRIL COM SUSPENSÃO E PUXADA PELA MANGA
  descricao_kodokan: Uma técnica para carregar o oponente na parte de trás do quadril e derrubá-lo, quebrando
    seu equilíbrio para frente enquanto segura sua manga esquerda com a mão direita e levantando-a.
  principio: TSURIKOMI = Movimento que caracteriza suspensão e puxada para si. Pela MANGA (sode) com alavanca
    no quadril (goshi).
  kyo_grupo:
    original: KOSHI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: tawara-gaeshi
  tecnica: Tawara-Gaeshi
  kanji: 俵返
  traducao: INVERSÃO DO FARDO DE PALHA TRANÇADA
  descricao_kodokan: Uma técnica para jogar o oponente por cima do ombro, desequilibrando-o para a frente,
    inclinando-se sobre suas costas, segurando e levantando a parte superior do corpo com ambos os braços
    enquanto deita o corpo de costas.
  principio: Contraposição a uma tentativa de Morote-gari, criando a resistência, desequilibrando o uke
    para frente. Domínio da parte superior do corpo e sacrifício pleno para projeção sobre o ombro.
  kyo_grupo:
    original: MA-SUTEMI-WAZA HABUKARETA-WAZA
    classe: habukareta-waza
- id: hikikomi-gaeshi
  tecnica: Hikikomi-gaeshi
  kanji: 引込返
  traducao: INVERSÃO COM PUXADA PARA SI
  descricao_kodokan: Uma técnica para jogar o oponente por cima da cabeça, quebrando seu equilíbrio para
    frente, aproximando a parte superior do corpo, enquanto segura a parte de trás do cinto com a mão
    direita e deita o corpo de costas, e levanta a parte interna da coxa esquerda com a perna direita.
  principio: Quebrar o equilíbrio do uke para frente. Agarra a parte de TRÁS DA FAIXA. Não há local especifico
    para o encaixe da perna desde que na parte interna da coxa.
  kyo_grupo:
    original: MA-SUTEMI-WAZA HABUKARETA-WAZA
    classe: habukareta-waza
- id: daki-wakare
  tecnica: Daki-wakare
  kanji: 抱分
  traducao: SEPARAÇÃO COM ABRAÇO
  descricao_kodokan: Uma técnica para lançar o oponente sobre o corpo, segurando a parte superior do corpo
    dele por trás quando ele estiver prestes a cair no tatame com ambas as mãos e pés e torcendo o corpo
    enquanto o deita sobre o lado esquerdo.
  principio: Domínio com abraço deve acontecer antes do corpo do uke estar no solo, realizando sacrífico
    lateral do corpo com giro.
  kyo_grupo:
    original: YOKO-SUTEMI-WAZA HABUKARETA-WAZA
    classe: habukareta-waza
- id: harai-makikomi
  tecnica: Harai-makikomi
  kanji: 払巻込
  traducao: ENROLAMENTO COM VARREDURA
  descricao_kodokan: Uma técnica para envolver o oponente e derruba-lo aplicando Harai-goshi e segurando
    seu braço direito na axila direita.
  principio: A ação como de um Harai-Goshi com o enrolamento do braço e realiza o sacrifício lateral da
    posição do tori.
  kyo_grupo:
    original: YOKO-SUTEMI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: uchi-mata-makikomi
  tecnica: Uchi-mata-makikomi
  kanji: 内股巻込
  traducao: ENROLAMENTO (COM PROJEÇÃO) NO INTERIOR DA COXA
  descricao_kodokan: Uma técnica para envolver o oponente e derrubá-lo aplicando Uchi-mata e segurando
    seu braço direito na axila direita
  principio: A ação como de um Uchi-mata com o enrolamento do braço e realiza o sacrifício lateral da
    posição do tori.
  kyo_grupo:
    original: YOKO-SUTEMI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: uchi-makikomi
  tecnica: Uchi-makikomi
  kanji: 内巻込
  traducao: ENROLAMENTO INTERIOR
  descricao_kodokan: Uma técnica para envolver o oponente e derrubá-lo, quebrando seu equilíbrio para
    frente, segurando o braço direito por dentro no braço direito e empurrando o quadril profundamente.
  principio: Enrolamento do braço, com saída profunda do quadril e sacrifício lateral do corpo.
  kyo_grupo:
    original: YOKO-SUTEMI-WAZA HABUKARETA-WAZA
    classe: habukareta-waza
- id: osoto-makikomi
  tecnica: O-soto-makikomi
  kanji: 大外巻込
  traducao: ENROLAMENTO EXTERIOR MAIOR
  descricao_kodokan: Uma técnica para envolver o oponente e derrubá-lo aplicando O-soto-gari e
  principio: A ação como de um O-soto-gari com o enrolamento do braço e realiza o sacrifício lateral da
    posição do tori.
  kyo_grupo:
    original: YOKO-SUTEMI-WAZA
- id: kouchi-makikomi
  tecnica: Ko-uchi-makikomi
  kanji: 小内巻込
  traducao: ENROLAMENTO INTERIOR MENOR
  descricao_kodokan: Uma técnica para envolver o oponente e derrubá-lo, desequilibrando-o para trás e
    prendendo a perna direita na perna direita dele por dentro, enquanto deita o corpo para frente.
  principio: Aprisionamento/enrolamento do interior da perna do uke, com sacrifício lateral
  kyo_grupo:
    original: YOKO-SUTEMI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: kani-basami
  tecnica: Kani-basami
  kanji: 蟹挟
  traducao: PINÇAMENTO DO CARANGUEJO
  descricao_kodokan: Uma técnica para derrubar o oponente enquanto segura a parte inferior do seu corpo
    com ambas as pernas, quebrando o equilíbrio para trás, girando o corpo para o lado esquerdo e colocando
    a perna direita na parte inferior do abdômen e a perna esquerda na parte de trás dos dois joelhos
    enquanto deita o corpo sobre o lado esquerdo.
  principio: Uma perna na parte inferior do abdômen e outra perna atrás dos dois joelhos. É permitido
    o tori apoiar o braço no chão para sua realização.
  kyo_grupo:
    original: YOKO-SUTEMI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: kawazu-gake
  tecnica: Kawazu-gake
  kanji: 河津掛
  traducao: ENGANCHAMENTO DO KAWAZU
  descricao_kodokan: Uma técnica para derrubar o oponente puxando-o para mais perto, girando o corpo,
    enganchando a perna direita em volta da perna esquerda por dentro e levantando a perna para frente
    enquanto deita o corpo com ele
  principio: Enganchar a perna do uke e levantá-lo, enquanto faz o sacrifício lateral da posição do tori
  kyo_grupo:
    original: YOKO-SUTEMI-WAZA SHIN-MEISHO-NO-WAZA
    classe: shinmeisho-no-waza
- id: kesa-gatame
  tecnica: Kesa-gatame
  kanji: 袈裟固
  traducao: Domínio pelo manto (kesa é um manto budista – conceito de diagonal)
  descricao_kodokan: Uma técnica para segurar a parte superior do corpo do oponente sob o lado direito
    da região do peito, segurando seu braço direito no braço esquerdo do lado direito do oponente deitado
    de costas e segurando a parte de trás da gola com a mão direita.
  principio: Domínio em diagonal Controle do braço Mão atrás da gola Posição das pernas
  kyo_grupo:
    original: OSAEKOMI-WAZA
- id: kuzure-kesa-gatame
  tecnica: Kuzure-kesa-gatame
  kanji: 崩袈裟固
  traducao: Domínio pelo manto modificado (kesa é um manto budista – conceito de diagonal)
  descricao_kodokan: Uma técnica para segurar a parte superior do corpo do oponente sob o lado direito
    da região do peito, segurando seu braço direito no braço esquerdo do lado direito do oponente deitado
    de costas e inserindo o braço direito através de sua axila esquerda.
  principio: Domínio em diagonal Controle do braço Mão dominando o ombro Pressão no plexo solar Posição
    das pernas
  kyo_grupo:
    original: OSAEKOMI-WAZA
- id: ushiro-kesa-gatame
  tecnica: Ushiro-kesa-gatame
  kanji: 後袈裟固
  traducao: Domínio pelo manto por trás (kesa é um manto budista – conceito de diagonal)
  descricao_kodokan: Uma técnica para segurar a parte superior do corpo do oponente sob o lado esquerdo
    da região do peito, colocando o quadril esquerdo no lado direito do corpo do oponente deitado de costas,
    segurando o braço direito no braço direito e a parte superior do corpo no braço esquerdo.
  principio: Domínio em diagonal Controle do punho/braço Controle da parte superior do corpo e quadril
  kyo_grupo:
    original: OSAEKOMI-WAZA
- id: kata-gatame
  tecnica: Kata-gatame
  kanji: 肩固
  traducao: Domínio pelo ombro
  descricao_kodokan: Técnica para segurar o oponente no chão, segurando seu braço direito e pescoço com
    o lado direito do pescoço e ambos os braços do lado direito do oponente deitado de costas.
  principio: Controle do braço em direção ao rosto do uke Perna na lateral do corpo do uke Quadril baixo
  kyo_grupo:
    original: OSAEKOMI-WAZA
- id: kami-shiho-gatame
  tecnica: Kami-shiho-gatame
  kanji: 上四方固
  traducao: Domínio dos quatro pontos pela parte superior
  descricao_kodokan: Uma técnica para segurar a parte superior do corpo do oponente abaixo da região do
    peito e abdômen, segurando ambos os lados do cinto com as duas mãos, na parte superior da cabeça,
    enquanto ele está deitado de costas.
  principio: Duas mãos na lateral da faixa Quadril baixo Apoio do peito contra o peito
  kyo_grupo:
    original: OSAEKOMI-WAZA
- id: kuzure-kami-shiho-gatame
  tecnica: Kuzure-kami-shiho-gatame
  kanji: 崩上四方固
  traducao: Domínio dos quatro pontos pela parte superior modificado
  descricao_kodokan: Uma técnica para segurar a parte superior do corpo do oponente abaixo da região do
    peito e abdômen, segurando seu braço direito no braço direito do lado diagonal direito da cabeça e
    segurando o lado esquerdo do cinto com a mão esquerda enquanto ele está deitado de costas.
  principio: Envolvimento do braço Segurar a gola atrás do pescoço Outra mão segurando a parte lateral
    da faixa
  kyo_grupo:
    original: OSAEKOMI-WAZA
- id: yoko-shiho-gatame
  tecnica: Yoko-shiho-gatame
  kanji: 横四方固
  traducao: Domínio dos quatro pontos pela lateral
  descricao_kodokan: Uma técnica para segurar a parte superior do corpo do oponente sob a região do peito
    e abdômen, agarrando seu cinto ou calças através de suas pernas com a mão direita do lado direito
    do oponente deitado de costas e segurando sua gola lateral esquerda através da parte de trás de seu
    pescoço com a mão esquerda.
  principio: Domínio da gola por baixo de pescoço do uke Domínio da faixa por baixo do quadril do uke
    Quadril baixo (tori)
  kyo_grupo:
    original: OSAEKOMI-WAZA
- id: tate-shiho-gatame
  tecnica: Tate-shiho-gatame
  kanji: 縦四方固
  traducao: Domínio dos quatro pontos pela vertical
  descricao_kodokan: Uma técnica para segurar a parte superior do corpo do oponente sob a região do peito
    e abdômen, deitando-se de bruços sobre o oponente deitado de costas, segurando seu braço direito e
    pescoço com ambas as mãos e segurando a parte inferior do corpo com ambas as pernas.
  principio: Controle do braço em direção ao rosto do uke Montada de bruços Controle dos membros inferiores
    com as pernas
  kyo_grupo:
    original: OSAEKOMI-WAZA
- id: uki-gatame
  tecnica: Uki-gatame
  kanji: 浮固
  traducao: Domínio com flutuação
  descricao_kodokan: Técnica para segurar a parte superior do corpo do oponente com a perna direita, segurando
    seu braço direito com um dos braços ou ambos do lado direito do oponente deitado de costas e esticando
    a perna esquerda para trás
  principio: Parte da tentativa de juji-gatame Controle do braço do uke Controle do corpo do uke com perna
    e quadril
  kyo_grupo:
    original: OSAEKOMI-WAZA
- id: ura-gatame
  tecnica: Ura-gatame
  kanji: 裏固
  traducao: Domínio pela retaguarda
  descricao_kodokan: Uma técnica para segurar o oponente na região das costas, segurando seu braço direito
    com o braço direito do lado direito do oponente deitado de costas e agarrando sua perna com a mão
    esquerda
  principio: Domínio com as costas Controle do punho/braço Controle da perna ou calça Os dois pés no solo
  kyo_grupo:
    original: OSAEKOMI-WAZA
- id: nami-juji-jime
  tecnica: Nami-juji-jime
  kanji: 並十字絞
  traducao: Estrangulamento cruzado regular
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente cruzando os pulsos pela
    frente, segurando as laterais do pescoço com os dois polegares para dentro e empurrando com as duas
    mãos.
  principio: Aprofundamento dos polegares Carótidas
  kyo_grupo:
    original: SHIME-WAZA
- id: gyaku-juji-jime
  tecnica: Gyaku-juji-jime
  kanji: 逆十字絞
  traducao: Estrangulamento cruzado invertido
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente cruzando os pulsos pela
    frente, segurando as laterais do pescoço com quatro dedos de ambas as mãos para dentro e apertando
    os braços.
  principio: Aprofundamento dos 4 dedos Carótidas
  kyo_grupo:
    original: SHIME-WAZA
- id: kata-juji-jime
  tecnica: Kata-juji-jime
  kanji: 片十字絞
  traducao: Estrangulamento cruzado irregular
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente cruzando os pulsos pela
    frente, segurando a gola lateral esquerda com quatro dedos da mão esquerda para dentro e a gola lateral
    direita com o polegar direito para dentro, puxando a mão esquerda e empurrando a mão direita.
  principio: Uma mão com aprofundamento do polegar e outra com aprofundamento dos 4 dedos Carótidas
  kyo_grupo:
    original: SHIME-WAZA
- id: hadaka-jime
  tecnica: Hadaka-jime
  kanji: 裸絞
  traducao: Estrangulamento desnudo
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente sem usar judogi, colocando
    o antebraço direito na garganta do oponente por trás e unindo o braço esquerdo sobre ele.
  principio: Lâmina do antebraço no pescoço do uke Recuar uma perna e depois a outra (tori) Puxar para
    trás, sem deixar espaço entre os corpos
  kyo_grupo:
    original: SHIME-WAZA
- id: okuri-eri-jime
  tecnica: Okuri-eri-jime
  kanji: 送襟絞
  traducao: Estrangulamento com condução de gola
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente segurando sua gola lateral
    esquerda através de sua garganta com a mão direita e a lapela frontal direita através da axila esquerda
    com a mão esquerda por trás puxando a mão direita na direção direita-trás e puxando a mão esquerda
    para baixo.
  principio: Aprofundamento do punho na gola/carótida Condução de uma gola para lateral e outra para baixo
    (gravata) Abaixa a cabeça (tori)
  kyo_grupo:
    original: SHIME-WAZA
- id: kata-ha-jime
  tecnica: Kataha-jime
  kanji: 片羽絞
  traducao: Estrangulamento com uma asa
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente segurando sua gola lateral
    esquerda através de sua garganta com a mão direita por trás, inserindo o braço esquerdo através da
    axila esquerda para levantar o braço para cima, puxando a mão direita na direção direita-traseira
    e empurrando a mão esquerda sob o braço direito
  principio: Aprofundamento do punho na gola/carótida Deslizar o braço da axila do uke até o antebraço.
    Mão passa por trás da nuca do uke, até o próprio cotovelo do tori
  kyo_grupo:
    original: SHIME-WAZA
- id: kata-te-jime
  tecnica: Katate-jime
  kanji: 片手絞
  traducao: Estrangulamento com uma mão
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente segurando sua gola lateral
    direita com o polegar direito para dentro, do lado esquerdo do oponente deitado de costas.
  principio: Controle do braço do uke Polegar dentro da gola Antebraço no pescoço
  kyo_grupo:
    original: SHIME-WAZA
- id: ryo-te-jime
  tecnica: Ryote-jime
  kanji: 両手絞
  traducao: Estrangulamento com ambas as mãos
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente com os punhos pela frente,
    segurando a gola lateral esquerda com o polegar direito para dentro e a gola lateral direita com o
    polegar esquerdo para dentro.
  principio: Polegares para dentro Pressão com os 4 dedos Trazer para perto do corpo
  kyo_grupo:
    original: SHIME-WAZA
- id: sode-guruma-jime
  tecnica: Sode-guruma-jime
  kanji: 袖車絞
  traducao: Estrangulamento com rotação da manga
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente pela frente, colocando
    o antebraço direito em sua garganta e o antebraço esquerdo atrás do pescoço para segurar seu pescoço
    entre eles, segurando o punho direito com a mão esquerda e empurrando a mão direita no lado direito
    do pescoço.
  principio: Antebraço na garganta Outro antebraço atrás do pescoço Rotação da manga
  kyo_grupo:
    original: SHIME-WAZA
- id: tsukkomi-jime
  tecnica: Tsukkomi-jime
  kanji: 突込絞
  traducao: Estrangulamento com transpasse
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente pela frente, segurando
    sua lapela frontal direita com a mão esquerda e a lapela frontal esquerda com a mão direita e empurrando
    a mão direita em direção ao lado direito do pescoço
  principio: Empurra uma gola contra o pescoço e puxa a outra para baixo Transpasse por cima ou por baixo
  kyo_grupo:
    original: SHIME-WAZA
- id: sankaku-jime
  tecnica: Sankaku-jime
  kanji: 三角絞
  traducao: Estrangulamento em triângulo
  descricao_kodokan: Uma técnica para estrangular a região do pescoço do oponente segurando seu pescoço
    e axila direita entre as duas pernas e enganchando o pé direito na parte de trás do joelho esquerdo,
    formando um triângulo.
  principio: Segurar a gola cruzada Fechamento do triangulo enganchando o pé atrás do outro joelho
  kyo_grupo:
    original: SHIME-WAZA
- id: do-jime
  tecnica: Do-jime
  kanji: 胴絞
  traducao: Estrangulamento do torso
  descricao_kodokan: Uma técnica para estrangular o oponente segurando a região do tronco dele entre as
    duas pernas.
  principio: Guarda-de-pernas fechada Perna entrelaçada Puxar o uke em sua direção
  kyo_grupo:
    original: SHIME-WAZA
- id: ude-garami
  tecnica: Ude-garami
  kanji: 腕緘
  traducao: Entrelaçamento do braço
  descricao_kodokan: Uma técnica para torcer e travar a articulação do cotovelo do oponente, agarrando
    seu pulso esquerdo com a mão esquerda do lado direito do oponente deitado de costas e inserindo a
    mão direita para segurar o pulso esquerdo por baixo do braço.
  principio: Segurar o punho Entrelaçar o braço Segura o próprio antebraço
  kyo_grupo:
    original: KANSETSU-WAZA
- id: ude-hishigi-juji-gatame
  tecnica: Ude-hishigi-juji-gatame
  kanji: 腕挫十字固
  traducao: Domínio pelo cruzamento com luxação de braço
  descricao_kodokan: Uma técnica para esticar e travar a articulação do cotovelo do oponente, segurando
    seu pulso direito com ambas as mãos do lado direito do oponente deitado de costas e segurando seu
    braço entre as duas coxas.
  principio: Segurar o punho Um pé na axila e outra por cima da cabeça Unir os joelhos
  kyo_grupo:
    original: KANSETSU-WAZA
- id: ude-hishigi-ude-gatame
  tecnica: Ude-hishigi-ude-gatame
  kanji: 腕挫腕固
  traducao: Domínio pelo braço com luxação de braço
  descricao_kodokan: Uma técnica para esticar e travar a articulação do cotovelo do oponente com ambas
    as mãos, segurando seu pulso esquerdo entre o pescoço e o ombro direito, do lado direito do oponente
    deitado de costas.
  principio: Prender a mão entre a cabeça e o ombro Mão no cotovelo e outra mão sobre Joelho sobre o abdômen
    para bloqueio
  kyo_grupo:
    original: KANSETSU-WAZA
- id: ude-hishigi-hiza-gatame
  tecnica: Ude-hishigi-hiza-gatame
  kanji: 腕挫膝固
  traducao: Domínio pelo joelho com luxação de braço
  descricao_kodokan: Uma técnica para esticar e travar a articulação do cotovelo do oponente com o joelho
    esquerdo, segurando o braço direito dele sob a axila esquerda pela frente.
  principio: Envolvimento do braço, trancando a mão na axila e trancando o cotovelo Pé na virilha para
    tombar Pé na lateral das costas com joelho pressionando cotovelo
  kyo_grupo:
    original: KANSETSU-WAZA
- id: ude-hishigi-waki-gatame
  tecnica: Ude-hishigi-waki-gatame
  kanji: 腕挫腋固
  traducao: Domínio pela axila com luxação de braço
  descricao_kodokan: Uma técnica para esticar e travar a articulação do cotovelo do oponente segurando
    seu pulso direito com ambas as mãos e segurando o braço sob a axila esquerda.
  principio: Controle o pulso com as duas mãos Domínio sob a região da axila Deslocamento diagonal
  kyo_grupo:
    original: KANSETSU-WAZA
- id: ude-hishigi-hara-gatame
  tecnica: Ude-hishigi-hara-gatame
  kanji: 腕挫腹固
  traducao: Domínio pelo abdômen com luxação de braço
  descricao_kodokan: Uma técnica para esticar e travar a articulação do cotovelo do oponente, agarrando
    seu pulso direito com a mão direita do lado direito do oponente e pressionando seu braço no abdômen
  principio: Controle do pulso com uma mão com alavanca de apoio na perna Pressão pelo abdômen
  kyo_grupo:
    original: KANSETSU-WAZA
- id: ude-hishigi-ashi-gatame
  tecnica: Ude-hishigi-ashi-gatame
  kanji: 腕挫脚固
  traducao: Domínio pela perna com luxação de braço
  descricao_kodokan: Uma técnica para esticar e travar a articulação do cotovelo do oponente, enganchando
    a perna direita no braço direito do oponente, deitado de bruços.
  principio: Enlace do braço com a perna Deita-se de bruços Estica e trava a articulação
  kyo_grupo:
    original: KANSETSU-WAZA
- id: ude-hishigi-te-gatame
  tecnica: Ude-hishigi-te-gatame
  kanji: 腕挫手固
  traducao: Domínio pela mão com luxação de braço
  descricao_kodokan: Uma técnica para esticar e travar a articulação do cotovelo do oponente, inserindo
    o braço esquerdo do lado direito do oponente através da axila direita para segurar sua lapela frontal
    esquerda e agarrar seu pulso direito com a mão direita ou outra técnica para travar a articulação
    do cotovelo do oponente, agarrando seu pulso com uma das mãos ou ambas e torcendo seu pulso atrás
    as costas.
  principio: Domínio pelo pulso Alavanca por baixo do cotovelo com ponto de apoio na gola do uke Trava
    na articulação
  kyo_grupo:
    original: KANSETSU-WAZA
- id: ude-hishigi-sankaku-gatame
  tecnica: Ude-hishigi-sankaku-gatame
  kanji: 腕挫三角固
  traducao: Domínio pelo triângulo com luxação de braço
  descricao_kodokan: Uma técnica para torcer ou esticar e travar a articulação do cotovelo do oponente
    segurando seu pescoço e axila direita entre as duas pernas e enganchando o pé direito na parte de
    trás do joelho esquerdo, formando um triângulo.
  principio: Tombamento com perna já por baixo do corpo Aproximação para fechamento do triângulo Possibilidade
    de chave nos dois braços
  kyo_grupo:
    original: KANSETSU-WAZA
- id: ashi-garami
  tecnica: Ashi-garami
  kanji: 足緘
  traducao: Entrelaçamento da perna
  descricao_kodokan: Uma técnica para esticar e travar a articulação do joelho do oponente, inserindo
    o pé esquerdo entre as pernas do oponente pela frente e envolvendo a perna esquerda ao redor da perna
    direita dele por trás para empurrá-la para a parte inferior do abdômen.
  principio: Tentativa de Tomoe-nage Enlace da perna com encaixe no abdômen Pé no joelho para derrubar
    uke
  kyo_grupo:
    original: KANSETSU-WAZA
