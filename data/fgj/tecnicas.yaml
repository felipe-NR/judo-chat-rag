    aproximando a parte superior do corpo, enquanto segura sua lapela ou costas com a mão direita e deita
    o corpo de costas, levantando a parte interna da coxa esquerda com a perna direita.
  principio: Tsurite nas costas ou na gola do Uwagi. Encaixar a perna NA PARTE DE TRÁS DO JOELHO MA-SUTEMI
