# Gerado por scripts/import_fgj.py a partir do material da FGJ. Não edite à mão.
- termo: NAGE-WAZA
  traducao: TÉCNICAS DE PROJEÇÃO
  conceito: Contempla Tachi-waza e Sutemi-waza
- termo: TACHI-WAZA
  traducao: TÉCNICAS EM PÉ
  conceito: Contempla Te-waza, Koshi-waza e Ashi-waza
- termo: SUTEMI-WAZA
  traducao: TÉCNICAS DE SACRIFÍCIO
  conceito: O TORI sacrifica a SUA posição para executar a técnica
- termo: TE-WAZA
  traducao: TÉCNICAS DE MEMBROS SUPERIORES
  conceito: Na origem do ideograma “TE”, ele referia-se a ao braço como um todo e incluía a mão.
- termo: KOSHI-WAZA
  traducao: TÉCNICAS DE QUADRIL
  conceito: O quadril é a parte do corpo com maior ação na projeção ou como ponto de apoio.
- termo: ASHI-WAZA
  traducao: TÉCNICAS DE MEMBROS INFERIORES
  conceito: Na origem do ideograma “ASHI”, ele referia-se a perna como um todo e incluía o pé
- termo: MA-SUTEMI-WAZA
  traducao: TÉCNICAS DE SACRIFÍCIO PLENO
  conceito: Ideograma “ma” significa “pleno”, “verdadeiramente”, ou seja, tori se sacrificou totalmente/plenamente,
    colocando-se de costas, para executar a técnica
- termo: YOKO-SUTEMI-WAZA
  traducao: TÉCNICAS DE SACRIFÍCIO LATERAL
  conceito: Tori sacrifica sua posição, terminando lateralmente no solo para executar a técnica
- termo: KATAME-WAZA
  traducao: TÉCNICAS DE DOMÍNIO
  conceito: Katame envolve “estrangular, impedir de levantar, torcer articulações”
- termo: OSAE-WAZA
  traducao: TÉCNICAS DE IMOBILIZAÇÃO OU RETENÇÃO
  conceito: Técnicas para segurar, reter, mesmo que não consiga torna-lo imóvel, o impedirá de levantar
- termo: SHIME-WAZA
  traducao: TÉCNICAS DE ESTRANGULAMENTO
  conceito: Técnicas que causam restrição do fluxo sanguíneo ou restrição das vias áreas.
- termo: KANSETSU-WAZA
  traducao: TÉCNICAS NAS ARTICULAÇÕES
  conceito: Objetiva a luxação, torção, da articulação
- termo: AGE
  traducao: ELEVAÇÃO
  conceito: Por exemplo no Daki-age (elevação com abraço)
- termo: AI-YOTSU
  traducao: PEGADA MÚTUA
  conceito: 'Exemplo: Pegada destro x destro'
- termo: AOMUKE
  traducao: DECUBITO DORSAL
  conceito: Ficar de costas no solo
- termo: ASHI-NO SABAKI KATA
  traducao: MODOS DE MANEJO E CONTROLE DAS PERNAS
  conceito: Expressão para guarda-de-pernas
- termo: AYUMI-ASHI
  traducao: PASSADAS NORMAIS
  conceito: null
- termo: BASAMI
  traducao: PINÇA
  conceito: Movimento que utiliza as pernas como se fosse uma pinça
- termo: CHIKAMA
  traducao: PRÓXIMO/DISTÂNCIA CURTA
  conceito: Distância curta (utilizado no katame-no-kata)
- termo: CHOKURITSU
  traducao: POSIÇÃO DE SENTIDO
  conceito: Posição e postura tradicional do judô com calcanhares unidos e corpo ereto
- termo: DE
  traducao: SAIR DO LUGAR
  conceito: No de-ashi-harai devemos varrer o pé que saiu do lugar, seja avançando ou recuando.
- termo: EBI
  traducao: CAMARÃO
  conceito: Movimento característico da fuga de quadril
- termo: FUSEGI
  traducao: DEFESA
  conceito: Defesa, proteção. Característico, por exemplo, em defender-se com uma guarda de perna
- termo: GARI
  traducao: CEIFA
  conceito: Movimento quando o peso está na perna a ser ceifada, como o movimento de um corte de uma raiz
- termo: GAKE
  traducao: ENGANCHAMENTO
  conceito: Suspensão do uke, e aplicação de um movimento de baixo para cima como quando arranca uma raiz
    com um ancinho
- termo: GAESHI
  traducao: CONTRAGOLPE/INVERSÃO
  conceito: Movimento que busca um contragolpe ou uma inversão.
- termo: GARAMI
  traducao: ENTRELAÇAMENTO
  conceito: Movimento que tem o princípio de entrelaçar membros superiores ou inferiores
- termo: GISO KOGEKI
  traducao: FALSO ATAQUE
  conceito: Como na punição característica com shidô.
- termo: GURUMA
