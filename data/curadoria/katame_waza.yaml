# Curadoria das técnicas de controle no solo (katame-waza): 10 osaekomi-waza,
# 12 shime-waza e 10 kansetsu-waza da nomenclatura do Kodokan, mais as entradas
# fora dela que vêm do CSV do judo-techniques-bot.
# `ijf_name`: forma curta usada pela IJF (padrão de competição, não é erro).

# ---------- osaekomi-waza (imobilizações) ----------
- id: kesa-gatame
  name: Kesa-gatame
  csv: [Kesa Gatame]
  group: katame-waza/osaekomi-waza
  name_pt_br: Imobilização em faixa diagonal
  description_pt_br: >-
    O tori senta-se ao lado do uke, de frente para a cabeça dele, prende um braço do
    uke debaixo da axila e envolve o pescoço com o outro braço, mantendo o peso sobre
    o peito dele. "Kesa" é a faixa diagonal da vestimenta de monge budista.

- id: kuzure-kesa-gatame
  name: Kuzure-kesa-gatame
  csv: [Kuzure Kesa Gatame]
  group: katame-waza/osaekomi-waza
  name_pt_br: Imobilização em faixa diagonal modificada
  description_pt_br: >-
    Variante do Kesa-gatame em que o braço do tori passa por baixo da axila do uke,
    em vez de envolver o pescoço.

- id: ushiro-kesa-gatame
  name: Ushiro-kesa-gatame
  csv: [Ushiro Kesa Gatame]
  group: katame-waza/osaekomi-waza
  name_pt_br: Imobilização em faixa diagonal invertida
  description_pt_br: >-
    O tori senta-se ao lado do uke de frente para os pés dele, prende o braço mais
    próximo e controla o tronco pela faixa ou pelo lado oposto.
  notes:
    - Entrada recente na lista do Kodokan, segundo a sessão judo-techniques-bot; conferir contra a lista publicada.

- id: kata-gatame
  name: Kata-gatame
  csv: [Kata Gatame]
  group: katame-waza/osaekomi-waza
  name_pt_br: Imobilização pelo ombro
  description_pt_br: >-
    O tori prende a cabeça e um braço do uke juntos, apertando o braço dele contra o
    pescoço com a própria cabeça e os braços entrelaçados. No judô é uma
    imobilização; no jiu-jitsu a mesma posição é usada como estrangulamento.
  bjj: [Arm Triangle Choke, Head and Arm Choke]

- id: kami-shiho-gatame
  name: Kami-shiho-gatame
  csv: [Kami Shiho Gatame]
  group: katame-waza/osaekomi-waza
  name_pt_br: Imobilização pelos quatro cantos por cima
  description_pt_br: >-
    O tori deita-se sobre o uke vindo pelo lado da cabeça dele, com o peito sobre o peito
    do uke, segurando a faixa pelos dois lados por baixo dos braços dele.
  bjj: [North South Position]

- id: kuzure-kami-shiho-gatame
  name: Kuzure-kami-shiho-gatame
  csv: [Kuzure Kami Shiho Gatame]
  group: katame-waza/osaekomi-waza
  name_pt_br: Imobilização pelos quatro cantos por cima modificada
  description_pt_br: >-
    Variante do Kami-shiho-gatame em que o tori fica em diagonal e passa um braço por
    baixo do braço do uke para segurar a gola nas costas.
  bjj: [North South Position]

- id: yoko-shiho-gatame
  name: Yoko-shiho-gatame
  csv: [Yoko Shiho Gatame]
  group: katame-waza/osaekomi-waza
  name_pt_br: Imobilização lateral pelos quatro cantos
  description_pt_br: >-
    O tori deita-se atravessado sobre o uke, pelo lado, com um braço entre as pernas dele
    e o outro por baixo do pescoço, controlando quadril e ombros.
  bjj: [Side Control]

- id: tate-shiho-gatame
  name: Tate-shiho-gatame
  csv: [Tate Shiho Gatame]
  group: katame-waza/osaekomi-waza
  name_pt_br: Imobilização montada pelos quatro cantos
  description_pt_br: >-
    O tori monta sobre o tronco do uke, prende as pernas dele com as próprias pernas e
    controla a cabeça e um braço.
  bjj: [Full Mount]

- id: uki-gatame
  name: Uki-gatame
  csv: [Uki Gatame]
  group: katame-waza/osaekomi-waza
  name_pt_br: Imobilização flutuante
  description_pt_br: >-
    O tori fica ao lado do uke apoiado num joelho sobre o abdômen dele, controlando o
    braço e o pescoço, numa posição alta e móvel.
  notes:
    - Entrada recente na lista do Kodokan, segundo a sessão judo-techniques-bot; conferir contra a lista publicada.

- id: ura-gatame
  name: Ura-gatame
  csv: [Ura Gatame]
  group: katame-waza/osaekomi-waza
  name_pt_br: Imobilização por trás
  description_pt_br: >-
    O tori controla o uke deitando-se de costas sobre o tronco dele, de lado, prendendo um
    braço do uke.
  notes:
    - Entrada recente na lista do Kodokan, segundo a sessão judo-techniques-bot; conferir contra a lista publicada.

# ---------- shime-waza (estrangulamentos) ----------
- id: nami-juji-jime
  name: Nami-juji-jime
  csv: [Nami Juji Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento cruzado normal
  description_pt_br: >-
    O tori cruza os braços e segura as duas golas do uke com as palmas para baixo
    (polegares por dentro), estrangulando com os antebraços dos lados do pescoço.

- id: gyaku-juji-jime
  name: Gyaku-juji-jime
  csv: [Gyaku Juji Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento cruzado invertido
  description_pt_br: >-
    O tori cruza os braços e segura as duas golas com as palmas para cima (dedos por
    dentro) e estrangula puxando os cotovelos para fora.

- id: kata-juji-jime
  name: Kata-juji-jime
  csv: [Kata Juji Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento meio cruzado
  description_pt_br: >-
    O tori cruza os braços segurando uma gola com a palma para cima e a outra com a
    palma para baixo.

- id: hadaka-jime
  name: Hadaka-jime
  csv: [Hadaka Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento nu
  description_pt_br: >-
    O tori, por trás do uke, passa o antebraço pela frente do pescoço dele e aperta sem
    usar a gola do judogi, por isso "nu". É o "mata-leão" do vocabulário brasileiro.
  bjj: [Rear Naked Choke (RNC)]

- id: okuri-eri-jime
  name: Okuri-eri-jime
  csv: [Okuri Eri Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento deslizando a gola
  description_pt_br: >-
    O tori, por trás do uke, segura a gola dele com as duas mãos (uma passando por baixo
    da axila) e estrangula puxando as golas em sentidos opostos.

- id: kata-ha-jime
  name: Kata-ha-jime
  csv: [Kata Ha Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento de uma asa
  description_pt_br: >-
    O tori, por trás do uke, segura a gola com uma mão e, com o outro braço, levanta um
    braço do uke (a "asa") e o empurra por trás da nuca, estrangulando.

- id: do-jime
  name: Do-jime
  csv: [Do Jime]
  group: katame-waza/shime-waza
  status: forbidden_ijf
  name_pt_br: Estrangulamento do tronco
  description_pt_br: >-
    O tori aperta o tronco do uke com as pernas cruzadas. Comprime o abdômen e as
    costelas, e não o pescoço, e é proibido em competição.

- id: sode-guruma-jime
  name: Sode-guruma-jime
  csv: [Sode Guruma Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento em roda com a manga
  description_pt_br: >-
    O tori segura a própria manga por dentro e, com o outro antebraço passando pela
    frente do pescoço do uke, aperta numa roda com as mangas. Conhecido no jiu-jitsu
    brasileiro como "Ezequiel".
  bjj: [Ezequiel Choke]

- id: kata-te-jime
  name: Kata-te-jime
  csv: [Kata Te Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento com uma mão
  description_pt_br: >-
    O tori estrangula segurando a gola do uke com uma única mão e pressionando o
    antebraço contra o pescoço.

- id: ryo-te-jime
  name: Ryo-te-jime
  csv: [Ryo Te Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento com as duas mãos
  description_pt_br: >-
    O tori segura as duas golas do uke sem cruzar os braços e estrangula pressionando os
    punhos contra os lados do pescoço.

- id: tsukkomi-jime
  name: Tsukkomi-jime
  csv: [Tsukkomi Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento empurrando
  description_pt_br: >-
    O tori fecha a gola do uke com uma mão e empurra o punho da outra contra o pescoço,
    estrangulando com a pressão.

- id: sankaku-jime
  name: Sankaku-jime
  csv: [Sankaku Jime]
  group: katame-waza/shime-waza
  name_pt_br: Estrangulamento em triângulo
  description_pt_br: >-
    O tori prende a cabeça e um braço do uke entre as pernas, que formam um triângulo,
    e estrangula apertando as coxas. É o "triângulo" do jiu-jitsu.
  bjj: [Triangle Choke]

# ---------- kansetsu-waza (chaves de articulação) ----------
- id: ude-garami
  name: Ude-garami
  csv: [Ude Garami]
  group: katame-waza/kansetsu-waza
  name_pt_br: Chave de braço enroscada
  description_pt_br: >-
    O tori dobra o braço do uke em ângulo reto e o torce segurando o punho com uma mão,
    enquanto a outra passa por baixo do braço dele e segura o próprio punho. Torcido
    para cima é a "americana" do jiu-jitsu; para trás, a "kimura".
  bjj: [Americana, Kimura]

- id: ude-hishigi-juji-gatame
  name: Ude-hishigi-juji-gatame
  ijf_name: Juji-gatame
  csv: [Ude Hishigi Juji Gatame, Juji Gatame]
  group: katame-waza/kansetsu-waza
  name_pt_br: Chave de braço em cruz
  description_pt_br: >-
    O tori deita-se perpendicular ao uke, com as pernas sobre o peito e a cabeça dele,
    prende o braço estendido do uke entre as coxas e hiperestende o cotovelo
    levantando o quadril. É a chave de braço mais usada no judô; a IJF a registra
    como "Juji-gatame".
  bjj: [Armbar]

- id: ude-hishigi-ude-gatame
  name: Ude-hishigi-ude-gatame
  ijf_name: Ude-gatame
  csv: [Ude Hishigi Ude Gatame]
  group: katame-waza/kansetsu-waza
  name_pt_br: Chave de braço com o braço
  description_pt_br: >-
    O tori prende o punho do uke contra o próprio ombro ou pescoço e pressiona o
    cotovelo esticado dele com as duas mãos.
  notes:
    - Forma curta usada pela IJF segundo a sessão judo-techniques-bot; não apareceu na amostra do judobase.

- id: ude-hishigi-hiza-gatame
  name: Ude-hishigi-hiza-gatame
  ijf_name: Hiza-gatame
  csv: [Ude Hishigi Hiza Gatame]
  group: katame-waza/kansetsu-waza
  name_pt_br: Chave de braço com o joelho
  description_pt_br: >-
    O tori prende o braço estendido do uke debaixo da axila e pressiona o cotovelo dele
    com o joelho.
  notes:
    - Forma curta usada pela IJF segundo a sessão judo-techniques-bot; não apareceu na amostra do judobase.

- id: ude-hishigi-waki-gatame
  name: Ude-hishigi-waki-gatame
  ijf_name: Waki-gatame
  csv: [Ude Hishigi Waki Gatame, Waki Gatame]
  group: katame-waza/kansetsu-waza
  name_pt_br: Chave de braço com a axila
  description_pt_br: >-
    O tori prende o braço esticado do uke debaixo da própria axila e força o cotovelo
    para baixo com o peso do corpo. Aplicada de pé, quando o tori se joga ao solo, é
    punida pela IJF porque provoca lesões.
  notes:
    - Forma curta usada pela IJF segundo a sessão judo-techniques-bot; não apareceu na amostra do judobase.

- id: ude-hishigi-hara-gatame
  name: Ude-hishigi-hara-gatame
  ijf_name: Hara-gatame
  csv: [Ude Hishigi Hara Gatame]
  group: katame-waza/kansetsu-waza
  name_pt_br: Chave de braço com o abdômen
  description_pt_br: >-
    O tori prende o braço esticado do uke e pressiona o cotovelo dele com o abdômen.
  notes:
    - Forma curta usada pela IJF segundo a sessão judo-techniques-bot; não apareceu na amostra do judobase.

- id: ude-hishigi-ashi-gatame
  name: Ude-hishigi-ashi-gatame
  ijf_name: Ashi-gatame
  csv: [Ude Hishigi Ashi Gatame]
  group: katame-waza/kansetsu-waza
  name_pt_br: Chave de braço com a perna
  description_pt_br: >-
    O tori prende o braço esticado do uke e pressiona o cotovelo dele com a perna. Apesar
    do nome em inglês "Leg Lock" no CSV de origem, é uma chave de cotovelo, não de
    perna.
  drop_english: [Leg Lock]
  notes:
    - Forma curta usada pela IJF segundo a sessão judo-techniques-bot; não apareceu na amostra do judobase.

- id: ude-hishigi-te-gatame
  name: Ude-hishigi-te-gatame
  ijf_name: Te-gatame
  csv: [Ude Hishigi Te Gatame]
  group: katame-waza/kansetsu-waza
  name_pt_br: Chave de braço com a mão
  description_pt_br: >-
    O tori segura o punho do uke e pressiona o cotovelo esticado dele com a mão ou o
    antebraço.
  notes:
    - Forma curta usada pela IJF segundo a sessão judo-techniques-bot; não apareceu na amostra do judobase.

- id: ude-hishigi-sankaku-gatame
  name: Ude-hishigi-sankaku-gatame
  ijf_name: Sankaku-gatame
  csv: [Ude Hishigi Sankaku Gatame]
  group: katame-waza/kansetsu-waza
  name_pt_br: Chave de braço em triângulo
  description_pt_br: >-
    A partir do triângulo de pernas (como no Sankaku-jime), o tori estica o braço do uke
    e hiperestende o cotovelo.
  notes:
    - Entrada recente na lista do Kodokan, segundo a sessão judo-techniques-bot; conferir contra a lista publicada.

- id: ashi-garami
  name: Ashi-garami
  csv: [Ashi Garami]
  group: katame-waza/kansetsu-waza
  status: forbidden_ijf
  name_pt_br: Chave de perna enroscada
  description_pt_br: >-
    O tori enrosca as pernas na perna do uke e torce o joelho dele. Na competição de
    judô só são permitidas chaves no cotovelo, por isso é proibida.
  bjj: [Entangled Leg Lock, Single Leg X (SLX)]

# ---------- fora da nomenclatura do Kodokan ----------
- id: ashi-hishigi
  name: Ashi-hishigi
  csv: [Ashi Hishigi]
  group: katame-waza/kansetsu-waza
  status: nonstandard
  name_pt_br: Chave de tornozelo reta
  description_pt_br: >-
    Chave reta de tornozelo do jiu-jitsu. Não consta da nomenclatura do Kodokan e,
    como toda chave fora do cotovelo, é proibida na competição de judô.
  bjj: [Straight Ankle Lock]
