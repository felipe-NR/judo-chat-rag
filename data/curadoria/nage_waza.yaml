# Curadoria das técnicas de projeção (nage-waza).
# `csv`: linhas de judo-techniques-bot/judo_techniques_bot/data/techniques_fixtures.csv
# fundidas nesta entrada. O build traz de lá grafias, nomes em inglês e vídeo.
# Textos em pt-BR redigidos a partir dos nomes em inglês do CSV e da classificação
# do Kodokan; ficam com provenance translated_from_en até revisão humana.

# ---------- te-waza (técnicas de braço/mão) ----------
- id: seoi-nage
  name: Seoi-nage
  csv: [Seoi Nage, Morote Seoi Nage]
  group: nage-waza/te-waza
  name_pt_br: Projeção carregando nas costas
  description_pt_br: >-
    O tori desequilibra o uke para a frente, para que ele fique na ponta dos pés, gira
    de costas e encaixa o próprio corpo abaixo do centro de gravidade do uke, com os
    joelhos flexionados. Na forma do Kodokan, uma mão segura a gola e a outra segura a
    manga, e os dois braços trazem o uke para as costas do tori. Ao esticar as pernas e
    inclinar o tronco à frente, o tori projeta o uke por cima do ombro. O nome popular
    "morote seoi-nage" (seoi com as duas mãos) vem dessa pegada; no Ippon-seoi-nage, o
    tori solta a gola e passa o braço por baixo da axila do uke.

- id: ippon-seoi-nage
  name: Ippon-seoi-nage
  csv: [Ippon Seoi Nage]
  group: nage-waza/te-waza
  name_pt_br: Projeção pelas costas com um braço
  description_pt_br: >-
    Variante do Seoi-nage em que o tori solta a gola, passa o braço por baixo da axila
    do uke e prende o braço do uke contra o próprio ombro antes de girar e projetar. O
    Kodokan a reconheceu como técnica separada do Seoi-nage em 1997.

- id: seoi-otoshi
  name: Seoi-otoshi
  csv: [Seoi Otoshi]
  group: nage-waza/te-waza
  name_pt_br: Queda pelas costas
  description_pt_br: >-
    Parecida com o Seoi-nage, mas o tori desce sobre um ou os dois joelhos (ou bloqueia
    a perna do uke com a sua) e derruba o uke para a frente, em vez de carregá-lo
    sobre as costas. É a técnica oficial mais próxima do que se chama popularmente
    de "drop seoi".

- id: tai-otoshi
  name: Tai-otoshi
  csv: [Tai Otoshi]
  group: nage-waza/te-waza
  name_pt_br: Queda do corpo
  description_pt_br: >-
    O tori desequilibra o uke para a frente, gira e fica de lado, voltado para a mesma
    direção do uke, e coloca uma perna estendida diante da canela do uke, como
    obstáculo. A perna só bloqueia: quem projeta são as mãos, que trazem o uke para a
    frente e para baixo, e a rotação do tronco, para que ele tropece na perna e caia à
    frente.

- id: kata-guruma
  name: Kata-guruma
  csv: [Kata Guruma]
  group: nage-waza/te-waza
  name_pt_br: Roda pelos ombros
  description_pt_br: >-
    O tori coloca o uke atravessado sobre os ombros, segurando braço e perna, e o
    projeta para o lado. A forma clássica com a mão na perna é proibida em competição
    pela IJF desde a proibição de pegadas diretas nas pernas; variantes sem pegar na
    perna ainda aparecem nos registros da IJF.

- id: sukui-nage
  name: Sukui-nage
  csv: [Sukui Nage]
  group: nage-waza/te-waza
  name_pt_br: Projeção em concha
  description_pt_br: >-
    O tori recolhe o uke pelas pernas ou pelo tronco, o levanta como quem pega algo com
    uma concha e o derruba para trás. Também é conhecida como Te-guruma. Pegar nas
    pernas é proibido em competição pela IJF.

- id: obi-otoshi
  name: Obi-otoshi
  csv: [Obi Otoshi]
  group: nage-waza/te-waza
  name_pt_br: Queda pela faixa
  description_pt_br: >-
    O tori segura a faixa do uke pela frente, bloqueia o corpo do uke com o quadril ou a
    perna e o derruba para trás.

- id: yama-arashi
  name: Yama-arashi
  csv: [Yama Arashi]
  group: nage-waza/te-waza
  name_pt_br: Tempestade na montanha
  description_pt_br: >-
    O tori segura a gola e a manga do mesmo lado do uke, o desequilibra para a frente e
    varre a perna do uke com um movimento parecido com o do Harai-goshi. Ficou associada
    a Saigo Shiro, um dos primeiros alunos do Kodokan.

- id: morote-gari
  name: Morote-gari
  csv: [Morote Gari]
  group: nage-waza/te-waza
  name_pt_br: Ceifada com as duas mãos
  description_pt_br: >-
    O tori avança, abraça as duas pernas do uke com as mãos e o derruba para trás
    empurrando com o ombro. Proibida em competição pela IJF por ser pegada direta nas
    pernas.

- id: kuchiki-taoshi
  name: Kuchiki-taoshi
  csv: [Kuchiki Taoshi]
  group: nage-waza/te-waza
  name_pt_br: Derrubar a árvore podre
  description_pt_br: >-
    O tori segura uma perna do uke por trás do joelho com uma mão e o empurra para trás
    com a outra, para que ele caia como uma árvore. Proibida em competição pela IJF por
    ser pegada direta na perna.

- id: kibisu-gaeshi
  name: Kibisu-gaeshi
  csv: [Kibisu Gaeshi]
  group: nage-waza/te-waza
  name_pt_br: Reversão pelo calcanhar
  description_pt_br: >-
    O tori puxa o calcanhar do uke com uma mão enquanto empurra o tronco do uke para
    trás com a outra. Proibida em competição pela IJF por ser pegada direta na perna.

- id: uchi-mata-sukashi
  name: Uchi-mata-sukashi
  csv: [Uchi Mata Sukashi]
  group: nage-waza/te-waza
  name_pt_br: Esquiva do Uchi-mata
  description_pt_br: >-
    Contragolpe ao Uchi-mata: quando o uke levanta a perna para atacar, o tori recua a
    perna atacada, deixa a perna do uke passar no vazio e, com as mãos, gira o uke por
    cima, aproveitando o impulso do próprio ataque. Por isso é uma te-waza: a projeção
    vem das mãos.

- id: kouchi-gaeshi
  name: Kouchi-gaeshi
  csv: [Kouchi Gaeshi]
  group: nage-waza/te-waza
  name_pt_br: Contragolpe ao Kouchi-gari
  description_pt_br: >-
    Quando o uke tenta o Kouchi-gari, o tori retira a perna atacada e, com uma rotação
    do tronco, projeta o uke na direção do próprio ataque do uke.

- id: uki-otoshi
  name: Uki-otoshi
  csv: [Uki Otoshi]
  group: nage-waza/te-waza
  name_pt_br: Queda flutuante
  description_pt_br: >-
    O tori desequilibra o uke para a frente com um puxão forte das mãos e, ao mesmo
    tempo, se abaixa sobre um joelho, para que o uke caia rodando por cima do próprio
    pé. É uma técnica quase só de mãos, sem bloqueio de perna ou quadril.

- id: sumi-otoshi
  name: Sumi-otoshi
  csv: [Sumi Otoshi]
  group: nage-waza/te-waza
  name_pt_br: Queda no canto
  description_pt_br: >-
    O tori desequilibra o uke para o canto de trás (diagonal posterior) usando só as mãos,
    sem contato de perna, e o faz cair para trás.

- id: obi-tori-gaeshi
  name: Obi-tori-gaeshi
  csv: [Obi Tori Gaeshi]
  group: nage-waza/te-waza
  name_pt_br: Reversão pegando a faixa
  description_pt_br: >-
    O tori segura a faixa do uke por cima das costas, geralmente quando o uke ataca baixo,
    e o gira por cima de si para a projeção.

# ---------- koshi-waza (técnicas de quadril) ----------
- id: uki-goshi
  name: Uki-goshi
  csv: [Uki Goshi]
  group: nage-waza/koshi-waza
  name_pt_br: Quadril flutuante
  description_pt_br: >-
    O tori abraça a cintura do uke, encaixa o quadril de lado e gira, fazendo o uke rolar
    por cima do quadril. A rotação substitui a elevação; o uke "flutua" sobre o
    quadril do tori.

- id: o-goshi
  name: O-goshi
  csv: [O Goshi]
  group: nage-waza/koshi-waza
  name_pt_br: Grande projeção de quadril
  description_pt_br: >-
    O tori desequilibra o uke para a frente, passa o braço pela cintura do uke e gira
    até que o próprio quadril fique abaixo e além do quadril do uke, o que diferencia o
    O-goshi do Uki-goshi. Ao esticar as pernas e girar o tronco, o tori levanta o uke e
    o projeta por cima do quadril. É uma das primeiras técnicas ensinadas a iniciantes.

- id: koshi-guruma
  name: Koshi-guruma
  csv: [Koshi Guruma]
  group: nage-waza/koshi-waza
  name_pt_br: Roda pelo quadril
  description_pt_br: >-
    O tori desequilibra o uke para a frente, envolve o pescoço do uke com o braço e
    encaixa o quadril bem além do quadril do uke, mais do que no O-goshi, para que o uke
    gire por cima do quadril do tori como uma roda.
  drop_english: [Head Throw]

- id: tsurikomi-goshi
  name: Tsurikomi-goshi
  csv: [Tsurikomi Goshi]
  group: nage-waza/koshi-waza
  name_pt_br: Projeção de quadril com elevação e puxada
  description_pt_br: >-
    O tori eleva e traz o uke para si pela gola e pela manga (o tsurikomi), para que ele
    fique na ponta dos pés, encaixa o quadril abaixo do quadril do uke e o projeta à
    frente. Na forma clássica, o tori flexiona bastante os joelhos, para que o quadril
    fique bem abaixo do centro de gravidade do uke.

- id: sode-tsurikomi-goshi
  name: Sode-tsurikomi-goshi
  csv: [Sode Tsurikomi Goshi]
  group: nage-waza/koshi-waza
  name_pt_br: Projeção de quadril com elevação e puxada pelas mangas
  description_pt_br: >-
    Variante do Tsurikomi-goshi em que o tori segura as duas mangas e eleva um dos
    braços do uke, para que ele fique na ponta dos pés, antes de encaixar o quadril e
    projetar.

- id: harai-goshi
  name: Harai-goshi
  csv: [Harai Goshi]
  group: nage-waza/koshi-waza
  name_pt_br: Varrida com o quadril
  description_pt_br: >-
    O tori desequilibra o uke para a frente, para que ele fique na ponta dos pés, gira e
    cola o quadril ao quadril do uke. Com a perna estendida, o tori varre pela frente a
    coxa da perna do uke do lado do giro, com a parte de trás da própria coxa, e o
    projeta por cima do quadril.

- id: tsuri-goshi
  name: Tsuri-goshi
  csv: [Tsuri Goshi]
  group: nage-waza/koshi-waza
  name_pt_br: Projeção de quadril levantando pela faixa
  description_pt_br: >-
    O tori segura a faixa do uke por cima do braço (o-tsuri-goshi) ou por baixo dele
    (ko-tsuri-goshi), o levanta e o projeta por cima do quadril.

- id: hane-goshi
  name: Hane-goshi
  csv: [Hane Goshi]
  group: nage-waza/koshi-waza
  name_pt_br: Quadril em mola
  description_pt_br: >-
    O tori encaixa o quadril e, com a perna dobrada, levanta a coxa do uke por dentro,
    como uma mola, e o projeta para a frente.

- id: utsuri-goshi
  name: Utsuri-goshi
  csv: [Utsuri Goshi]
  group: nage-waza/koshi-waza
  name_pt_br: Troca de quadril
  description_pt_br: >-
    Contragolpe a uma técnica de quadril: o tori levanta o uke, passa o próprio quadril
    para a frente do uke e o derruba por cima.

- id: ushiro-goshi
  name: Ushiro-goshi
  csv: [Ushiro Goshi]
  group: nage-waza/koshi-waza
  name_pt_br: Quadril por trás
  description_pt_br: >-
    Contragolpe a uma técnica de quadril: o tori segura o uke por trás, o levanta com o
    quadril e o derruba de costas no tatame.

# ---------- ashi-waza (técnicas de perna/pé) ----------
- id: deashi-harai
  name: Deashi-harai
  csv: [De Ashi Harai]
  group: nage-waza/ashi-waza
  name_pt_br: Varrida no pé que avança
  description_pt_br: >-
    O tori varre o pé que o uke está trazendo à frente no instante em que ele vai apoiar
    o peso nesse pé, com a sola do pé contra a parte de fora do tornozelo, na mesma
    direção do passo. Ao mesmo tempo, as mãos giram o uke para o lado: a da manga traz
    para baixo e a da gola eleva. Como o pé sai do chão antes de receber o peso, o uke
    cai de lado. O momento certo vale mais que a força.

- id: hiza-guruma
  name: Hiza-guruma
  csv: [Hiza Guruma]
  group: nage-waza/ashi-waza
  name_pt_br: Roda pelo joelho
  description_pt_br: >-
    O tori apoia a sola do pé no joelho do uke como ponto de giro e, com as mãos, roda
    o uke por cima desse apoio.

- id: sasae-tsurikomi-ashi
  name: Sasae-tsurikomi-ashi
  csv: [Sasae Tsurikomi Ashi]
  group: nage-waza/ashi-waza
  name_pt_br: Bloqueio do pé com elevação e puxada
  description_pt_br: >-
    O tori eleva e traz o uke para si com as mãos, para que ele avance o peso sobre a
    perna da frente, e bloqueia a frente do tornozelo dessa perna com a sola do pé. O
    uke tropeça no bloqueio e cai para a frente, girando sobre ele.

- id: osoto-gari
  name: Osoto-gari
  csv: [Osoto Gari]
  group: nage-waza/ashi-waza
  name_pt_br: Grande ceifada externa
  description_pt_br: >-
    O tori traz a manga do uke para baixo e empurra a gola para trás, desequilibrando o
    uke para a diagonal de trás, para que todo o peso do uke fique sobre o calcanhar da
    perna que vai ser ceifada. Com o uke preso nesse apoio, o tori pisa com o pé de
    apoio ao lado do pé do uke e ceifa essa perna por trás com a outra perna, coxa
    contra coxa, de trás para a frente. Sem o único apoio, o uke cai de costas.

- id: ouchi-gari
  name: Ouchi-gari
  csv: [Ouchi Gari]
  group: nage-waza/ashi-waza
  name_pt_br: Grande ceifada interna
  description_pt_br: >-
    Para criar o desequilíbrio, o tori costuma movimentar o uke para a frente e depois
    para trás, ação e reação, para que ele jogue o peso para trás, sobre o calcanhar da
    perna que vai ser ceifada. Com o uke apoiado nesse calcanhar e de pernas afastadas,
    o tori encaixa a perna por dentro, entre as pernas do uke, e ceifa essa perna num
    arco de dentro para fora, com a parte de trás da perna, enquanto empurra o uke para
    trás com as mãos e o peito.

- id: kosoto-gari
  name: Kosoto-gari
  csv: [Kosoto Gari]
  group: nage-waza/ashi-waza
  name_pt_br: Pequena ceifada externa
  description_pt_br: >-
    No momento em que o uke apoia o peso sobre um pé, o tori o desequilibra para a
    diagonal de trás desse lado e ceifa o calcanhar desse pé por fora e por trás, com a
    sola do pé, na direção dos dedos do uke. O pé sai do chão justamente quando ia
    sustentar o corpo, e o uke cai para trás.

- id: kouchi-gari
  name: Kouchi-gari
  csv: [Kouchi Gari]
  group: nage-waza/ashi-waza
  name_pt_br: Pequena ceifada interna
  description_pt_br: >-
    Quando o uke dá um passo à frente, o tori ceifa esse pé por dentro, na altura do
    calcanhar, com a sola do pé, na direção dos dedos do uke, enquanto empurra o tronco
    do uke para a diagonal de trás desse lado. Sem a perna que ia receber o peso, o uke
    cai de costas.

- id: okuriashi-harai
  name: Okuriashi-harai
  csv: [Okuri Ashi Harai, Okuriashi Harai]
  group: nage-waza/ashi-waza
  name_pt_br: Varrida dos dois pés em deslocamento lateral
  description_pt_br: >-
    Quando o uke se desloca de lado, juntando um pé ao outro, o tori acompanha o
    movimento e, no instante em que os pés do uke se aproximam, varre os dois juntos com
    a sola do pé, na direção do deslocamento. Com as mãos, o tori eleva o uke, para que
    ele perca o apoio dos dois pés e caia de lado.

- id: uchi-mata
  name: Uchi-mata
  csv: [Uchi Mata]
  group: nage-waza/ashi-waza
  name_pt_br: Projeção pela parte interna da coxa
  description_pt_br: >-
    O tori desequilibra o uke para a frente, trazendo-o para junto do corpo durante o
    giro, para que o peso do uke fique na ponta dos pés. Em seguida, o tori levanta a
    parte interna da coxa do uke com a parte de trás da própria coxa e o projeta por
    cima, à frente. É uma das técnicas mais usadas em competição.

- id: kosoto-gake
  name: Kosoto-gake
  csv: [Kosoto Gake]
  group: nage-waza/ashi-waza
  name_pt_br: Pequeno gancho externo
  description_pt_br: >-
    O tori engancha por fora o calcanhar do uke com a perna e o puxa, enquanto empurra o tronco do uke para trás e para baixo.

- id: ashi-guruma
  name: Ashi-guruma
  csv: [Ashi Guruma]
  group: nage-waza/ashi-waza
  name_pt_br: Roda pela perna
  description_pt_br: >-
    O tori estende a perna esticada contra o joelho ou a coxa do uke e, girando o tronco,
    roda o uke por cima dela.

- id: harai-tsurikomi-ashi
  name: Harai-tsurikomi-ashi
  csv: [Harai Tsurikomi Ashi]
  group: nage-waza/ashi-waza
  name_pt_br: Varrida do pé com elevação e puxada
  description_pt_br: >-
    O tori eleva e traz o uke para si, como no Sasae-tsurikomi-ashi, mas em vez de
    bloquear, varre a frente do tornozelo do uke com a sola do pé, para que a perna saia
    do chão antes de receber o peso.

- id: o-guruma
  name: O-guruma
  csv: [O Guruma]
  group: nage-waza/ashi-waza
  name_pt_br: Grande roda
  description_pt_br: >-
    O tori estende a perna atravessada na altura do quadril ou da parte de cima da coxa
    do uke e o roda por cima dela, como um eixo.

- id: osoto-guruma
  name: Osoto-guruma
  csv: [O Soto Guruma]
  group: nage-waza/ashi-waza
  name_pt_br: Grande roda externa
  description_pt_br: >-
    Parecida com o Osoto-gari, mas a perna do tori passa por trás das duas pernas do uke
    e funciona como eixo para que o uke gire para trás.

- id: osoto-otoshi
  name: Osoto-otoshi
  csv: [Osoto Otoshi]
  group: nage-waza/ashi-waza
  name_pt_br: Grande queda externa
  description_pt_br: >-
    O tori coloca a perna por trás da perna do uke, como no Osoto-gari, mas em vez de
    ceifar empurra para baixo, derrubando o uke para trás.

- id: tsubame-gaeshi
  name: Tsubame-gaeshi
  csv: [Tsubame Gaeshi]
  group: nage-waza/ashi-waza
  name_pt_br: Reversão da andorinha
  description_pt_br: >-
    Contragolpe ao Deashi-harai: o tori desvia o pé da varrida do uke num movimento
    curto, como o voo de uma andorinha, e varre de volta o pé do uke.

- id: osoto-gaeshi
  name: Osoto-gaeshi
  csv: [Osoto Gaeshi]
  group: nage-waza/ashi-waza
  name_pt_br: Contragolpe ao Osoto-gari
  description_pt_br: >-
    Quando o uke ataca com o Osoto-gari, o tori resiste, gira e devolve a mesma ceifada
    externa, e quem cai é o uke.
  drop_english: [Foot Technique]

- id: ouchi-gaeshi
  name: Ouchi-gaeshi
  csv: [Ouchi Gaeshi]
  group: nage-waza/ashi-waza
  name_pt_br: Contragolpe ao Ouchi-gari
  description_pt_br: >-
    Quando o uke ataca com Ouchi-gari, o tori levanta a perna atacada, aproveita o impulso
    do uke e o projeta na direção da ceifada.
  drop_english: [Foot Technique]

- id: hane-goshi-gaeshi
  name: Hane-goshi-gaeshi
  csv: [Hane Goshi Gaeshi]
  group: nage-waza/ashi-waza
  name_pt_br: Contragolpe ao Hane-goshi
  description_pt_br: >-
    Quando o uke ataca com Hane-goshi, o tori bloqueia o quadril, levanta a perna de
    ataque do uke com a própria perna e o projeta para trás.
  drop_english: [Spring Hip]
  english_extra: [Spring Hip Counter]

- id: harai-goshi-gaeshi
  name: Harai-goshi-gaeshi
  csv: [Harai Goshi Gaeshi]
  group: nage-waza/ashi-waza
  name_pt_br: Contragolpe ao Harai-goshi
  description_pt_br: >-
    Quando o uke ataca com o Harai-goshi, o tori bloqueia o quadril e varre a perna de
    apoio do uke, que cai para trás.
  drop_english: [Sweeping Hip]
  english_extra: [Sweeping Hip Counter]

- id: uchi-mata-gaeshi
  name: Uchi-mata-gaeshi
  csv: [Uchi Mata Gaeshi]
  group: nage-waza/ashi-waza
  name_pt_br: Contragolpe ao Uchi-mata
  description_pt_br: >-
    Quando o uke ataca com Uchi-mata, o tori bloqueia, levanta a perna de ataque do uke e
    o projeta para trás com uma ceifada.
  drop_english: [Inner Thigh Reap]
  english_extra: [Inner Thigh Counter]

# ---------- ma-sutemi-waza (sacrifício para trás) ----------
- id: tomoe-nage
  name: Tomoe-nage
  csv: [Tomoe Nage]
  group: nage-waza/ma-sutemi-waza
  name_pt_br: Projeção em círculo
  description_pt_br: >-
    O tori desequilibra o uke para a frente, para que ele avance o peso, e se senta de
    costas no tatame, o mais perto possível dos calcanhares do uke. Com a sola do pé
    apoiada logo abaixo da faixa do uke e as mãos trazendo-o por cima, o tori estende a
    perna e projeta o uke por cima da própria cabeça, num arco. A variante em que o tori
    cai de lado é chamada popularmente de "yoko-tomoe-nage".

- id: sumi-gaeshi
  name: Sumi-gaeshi
  csv: [Sumi Gaeshi]
  group: nage-waza/ma-sutemi-waza
  name_pt_br: Reversão pelo canto
  description_pt_br: >-
    O tori cai de costas e traz o uke junto, coloca o peito do pé na parte interna da
    coxa do uke e o levanta, para que ele seja projetado para o canto à frente do tori.

- id: hikikomi-gaeshi
  name: Hikikomi-gaeshi
  csv: [Hikikomi Gaeshi]
  group: nage-waza/ma-sutemi-waza
  name_pt_br: Reversão puxando para dentro
  description_pt_br: >-
    O tori segura a faixa ou as costas do uke por cima e cai de costas, trazendo o uke
    junto; com o pé na coxa do uke, o tori o projeta por cima de si.

- id: tawara-gaeshi
  name: Tawara-gaeshi
  csv: [Tawara Gaeshi]
  group: nage-waza/ma-sutemi-waza
  name_pt_br: Reversão do fardo de arroz
  description_pt_br: >-
    Quando o uke ataca baixo, o tori abraça o tronco do uke por cima, como quem levanta
    um fardo de arroz, cai de costas e o projeta por cima da cabeça.

- id: ura-nage
  name: Ura-nage
  csv: [Ura Nage]
  group: nage-waza/ma-sutemi-waza
  name_pt_br: Projeção para trás
  description_pt_br: >-
    O tori abraça o uke pela cintura, por trás ou de lado, o levanta com o quadril e cai
    para trás, arremessando o uke por cima do próprio ombro.

# ---------- yoko-sutemi-waza (sacrifício lateral) ----------
- id: yoko-otoshi
  name: Yoko-otoshi
  csv: [Yoko Otoshi]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Queda lateral
  description_pt_br: >-
    O tori desequilibra o uke para o lado, desliza a perna diante dos pés do uke e se
    deixa cair de lado, levando o uke junto para o tatame.

- id: tani-otoshi
  name: Tani-otoshi
  csv: [Tani Otoshi]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Queda no vale
  description_pt_br: >-
    O tori coloca a perna estendida por trás dos calcanhares do uke e se deixa cair de
    lado, para que o uke caia para trás no "vale" que se forma atrás do uke.

- id: hane-makikomi
  name: Hane-makikomi
  csv: [Hane Makikomi]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Enrolamento em mola
  description_pt_br: >-
    O tori enrola o braço do uke em volta do próprio corpo, gira, levanta a perna do uke
    como no Hane-goshi e cai junto, levando o uke ao tatame.

- id: soto-makikomi
  name: Soto-makikomi
  csv: [Soto Makikomi]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Enrolamento externo
  description_pt_br: >-
    O tori prende o braço do uke debaixo da axila, solta a outra pegada, gira o corpo
    por fora e cai rodando, para que o uke seja enrolado no corpo do tori.

- id: uki-waza
  name: Uki-waza
  csv: [Uki Waza]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Técnica flutuante
  description_pt_br: >-
    O tori cai de lado, estende a perna para bloquear o pé do uke e, com um puxão das
    mãos, projeta o uke por cima do próprio corpo.

- id: yoko-wakare
  name: Yoko-wakare
  csv: [Yoko Wakare]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Separação lateral
  description_pt_br: >-
    O tori se lança de lado diante do uke, com as pernas esticadas à frente do uke, e o
    traz por cima do próprio corpo.

- id: yoko-guruma
  name: Yoko-guruma
  csv: [Yoko Guruma]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Roda lateral
  description_pt_br: >-
    Contragolpe a um ataque pela frente: o tori desliza a perna entre as pernas do uke,
    cai de lado e o roda por cima do ombro.

- id: yoko-gake
  name: Yoko-gake
  csv: [Yoko Gake]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Gancho lateral
  description_pt_br: >-
    O tori desequilibra o uke para o lado, varre o pé de apoio do uke com a sola do pé e
    cai de lado junto com ele.

- id: daki-wakare
  name: Daki-wakare
  csv: [Daki Wakare]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Abraçar e separar
  description_pt_br: >-
    Com o uke de quatro apoios, o tori abraça o tronco do uke por cima, o levanta e cai
    de lado, para que o uke gire para trás por cima do tori.

- id: uchi-makikomi
  name: Uchi-makikomi
  csv: [Uchi Makikomi]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Enrolamento interno
  description_pt_br: >-
    O tori passa o braço por cima do braço do uke, gira para dentro e cai rolando, para
    que o uke seja enrolado no corpo do tori.

- id: kani-basami
  name: Kani-basami
  csv: [Kani Basami]
  group: nage-waza/yoko-sutemi-waza
  status: forbidden_ijf
  name_pt_br: Tesoura de caranguejo
  description_pt_br: >-
    O tori salta de lado e prende o corpo do uke entre as pernas, como uma tesoura, uma
    perna na frente e outra atrás, e o derruba para trás. Causou lesões graves e é
    proibida em competição.

- id: osoto-makikomi
  name: Osoto-makikomi
  csv: [Osoto Makikomi]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Grande enrolamento externo
  description_pt_br: >-
    O tori entra como no Osoto-gari, enrola o braço do uke em volta do próprio corpo e
    cai rodando junto, levando o uke ao tatame.

- id: uchi-mata-makikomi
  name: Uchi-mata-makikomi
  csv: [Uchi Mata Makikomi]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Enrolamento do Uchi-mata
  description_pt_br: >-
    O tori entra com Uchi-mata, enrola o braço do uke em volta do próprio corpo e cai
    rodando para completar a projeção.

- id: harai-makikomi
  name: Harai-makikomi
  csv: [Harai Makikomi]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Enrolamento do Harai-goshi
  description_pt_br: >-
    O tori entra com Harai-goshi, enrola o braço do uke em volta do próprio corpo e cai
    rodando junto para completar a projeção.

- id: kouchi-makikomi
  name: Kouchi-makikomi
  csv: [Kouchi Makikomi]
  group: nage-waza/yoko-sutemi-waza
  name_pt_br: Enrolamento do Kouchi-gari
  description_pt_br: >-
    O tori prende o braço do uke debaixo da axila, ceifa o pé do uke por dentro, como no
    Kouchi-gari, e cai junto, de frente, por cima do uke.

- id: kawazu-gake
  name: Kawazu-gake
  csv: [Kawazu Gake]
  group: nage-waza/yoko-sutemi-waza
  status: forbidden_ijf
  name_pt_br: Enlaçamento em perna de sapo
  description_pt_br: >-
    O tori enrosca a perna em volta da perna do uke, por fora, e cai para trás junto com
    ele. Pressiona o joelho do uke de forma perigosa e é proibida em competição.

# ---------- fora da nomenclatura do Kodokan ----------
- id: reverse-seoi-nage
  name: Reverse seoi-nage
  csv: [Reverse Seoi Nage]
  group: nage-waza/te-waza
  status: nonstandard
  name_pt_br: Seoi invertido (seoi coreano)
  description_pt_br: >-
    Variação de seoi-nage com a pegada invertida: o tori gira para o lado oposto ao do
    braço que prende o uke. Popularizada por judocas sul-coreanos. Não tem nome próprio
    na nomenclatura do Kodokan e costuma ser registrada como uma das formas de
    Seoi-nage ou Ippon-seoi-nage.
  notes:
    - Classificação oficial incerta; a sessão judo-techniques-bot não tem alvo seguro.

- id: yagura-nage
  name: Yagura-nage
  csv: [Yagura Nage]
  group: nage-waza/ashi-waza
  status: nonstandard
  name_pt_br: Projeção em torre
  description_pt_br: >-
    O tori, de frente para o uke e com a pegada por cima das costas, o levanta com a
    perna por dentro da coxa do uke e o projeta de lado. Em inglês é chamada de "front
    uchi mata". Não consta da nomenclatura do Kodokan.
  notes:
    - Classificação oficial incerta; a sessão judo-techniques-bot não tem alvo seguro.

- id: daki-age
  name: Daki-age
  csv: [Daki-Age]
  status: nonstandard
  name_pt_br: Abraçar e levantar
  description_pt_br: >-
    Ação de levantar o uke, que está deitado de costas fazendo guarda, até a altura dos
    ombros do tori. Não é técnica de projeção da nomenclatura do Kodokan e é proibida
    em competição.
  bjj: [Body Slam]
  notes:
    - Status de regra informado pela sessão judo-techniques-bot; conferir no regulamento vigente.
