<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judô Chat</title>
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6860;
    --accent: #1f4e8c; --user: #e6edf7; --border: #dcd8ce; --refused: #fbefe6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515; --surface: #1f1f1f; --text: #eceae4; --muted: #a29f97;
      --accent: #8fb3e8; --user: #233247; --border: #333; --refused: #3a2a20;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; min-height: 100vh;
         display: flex; flex-direction: column; }
  header h1 { font-size: 1.3rem; margin: 8px 0 2px; }
  header p { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }
  .msg { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
         background: var(--surface); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; }
  .msg.bot, .msg.refused { white-space: normal; }
  .msg.bot p, .msg.bot ul, .msg.bot ol { margin: 0 0 10px; }
  .msg.bot h3 { font-size: 1.05rem; margin: 4px 0 10px; }
  .msg.bot ul, .msg.bot ol { padding-left: 22px; }
  .msg.bot hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
  .videos { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .videos strong { display: block; margin-bottom: 6px; font-size: .9rem; }
  .videos a { display: block; margin: 4px 0; }
  .badge { font-size: .75rem; padding: 1px 6px; border-radius: 6px; margin-right: 6px;
           background: var(--accent); color: var(--bg); }
  .msg.refused { background: var(--refused); }
  .tags { margin-top: 8px; font-size: .8rem; color: var(--muted); }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; }
  textarea { flex: 1; resize: vertical; min-height: 48px; padding: 10px; font: inherit;
             border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
  button { padding: 0 18px; font: inherit; border: 0; border-radius: 8px;
           background: var(--accent); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Judô Chat</h1>
    <p>Pergunte sobre técnicas, história e regras do judô.</p>
  </header>
  <section id="log" aria-live="polite"></section>
  <form id="form">
    <textarea id="query" maxlength="1000" placeholder="Ex.: Qual a diferença entre seoi-nage e ippon-seoi-nage?" required></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>
</main>
<script src="config.js"></script>
<script>
  // Vazio quando a página é servida pela própria API; no GitHub Pages, a URL do túnel ngrok.
  const API_URL = (window.JUDO_CHAT_API_URL || "").replace(/\/$/, "");
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("query");
  const button = document.getElementById("send");

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Markdown mínimo (títulos, negrito, itálico, listas, links, separador). O texto é
  // escapado antes, então só as marcações abaixo viram HTML.
  function inline(text) {
    return text
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  }

  function renderMarkdown(text) {
    const lines = escapeHtml(text).split("\n");
    const html = [];
    let list = null;
    const closeList = () => { if (list) { html.push(`</${list}>`); list = null; } };
    for (const raw of lines) {
      const line = raw.trim();
      let m;
      if (!line) { closeList(); continue; }
      if (/^-{3,}$/.test(line)) { closeList(); html.push("<hr>"); continue; }
      if ((m = line.match(/^#{1,6}\s+(.*)$/))) { closeList(); html.push(`<h3>${inline(m[1])}</h3>`); continue; }
      if ((m = line.match(/^[-*]\s+(.*)$/))) {
        if (list !== "ul") { closeList(); html.push("<ul>"); list = "ul"; }
        html.push(`<li>${inline(m[1])}</li>`); continue;
      }
      if ((m = line.match(/^\d+[.)]\s+(.*)$/))) {
        if (list !== "ol") { closeList(); html.push("<ol>"); list = "ol"; }
        html.push(`<li>${inline(m[1])}</li>`); continue;
      }
      closeList();
      html.push(`<p>${inline(line)}</p>`);
    }
    closeList();
    return html.join("");
  }

  function addMessage(text, kind, tags, videos) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    if (kind === "user") {
      div.textContent = text;
    } else {
      div.innerHTML = renderMarkdown(text);
    }
    if (videos && videos.length) {
      const box = document.createElement("div");
      box.className = "videos";
      const title = document.createElement("strong");
      title.textContent = "Vídeos";
      box.appendChild(title);
      for (const video of videos) {
        const a = document.createElement("a");
        a.href = video.url; a.target = "_blank"; a.rel = "noopener";
        if (video.kodokan) {
          const badge = document.createElement("span");
          badge.className = "badge"; badge.textContent = "Kodokan";
          a.appendChild(badge);
        }
        a.appendChild(document.createTextNode(video.technique + (video.kodokan ? " (vídeo oficial)" : " (outra fonte)")));
        box.appendChild(a);
      }
      div.appendChild(box);
    }
    if (tags) {
      const small = document.createElement("div");
      small.className = "tags";
      small.textContent = tags;
      div.appendChild(small);
    }
    log.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const query = input.value.trim();
    if (!query) return;
    addMessage(query, "user");
    input.value = "";
    button.disabled = true;
    try {
      const response = await fetch(API_URL + "/api/perguntar", {
        method: "POST",
        // Sem este header o ngrok gratuito devolve uma página de aviso em vez da API.
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" },
        body: JSON.stringify({ query }),
      });
      const data = await response.json();
      if (!response.ok) {
        addMessage(data.detail || "Erro ao responder.", "refused");
        return;
      }
      const found = data.techniques_detected.map((t) => t.term + (t.ambiguous ? " (ambíguo)" : ""));
      const tags = found.length ? "Técnicas reconhecidas: " + found.join(", ") : "";
      addMessage(data.answer, data.refused ? "refused" : "bot", tags, data.videos);
    } catch (error) {
      addMessage("Não foi possível falar com o servidor. Ele pode estar desligado.", "refused");
    } finally {
      button.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
